<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 180" width="828" height="180" role="img" aria-label="opencode-claude - Claude Code in OpenCode, local CLI auth, Agent SDK">
  <style>
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
    .sans { font-family: ui-sans-serif, "Segoe UI", system-ui, sans-serif; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .rise1 { animation: rise 900ms cubic-bezier(0.16,1,0.3,1) 100ms both; }
    .rise2 { animation: rise 900ms cubic-bezier(0.16,1,0.3,1) 200ms both; }
    .rise3 { animation: rise 900ms cubic-bezier(0.16,1,0.3,1) 300ms both; }
    .sweep { transform-origin: 40px 0; transform: scaleX(0); animation: sweep 850ms cubic-bezier(0.16,1,0.3,1) 400ms forwards; }
    .scan { animation: scan 3.6s cubic-bezier(0.45,0,0.55,1) 1.3s infinite; }
    .blink { animation: blink 1.05s steps(1) infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes sweep { to { transform: scaleX(1); } }
    @keyframes scan {
      0% { transform: translateX(0); opacity: 0; }
      8% { opacity: 1; }
      62% { transform: translateX(748px); opacity: 1; }
      72%, 100% { transform: translateX(748px); opacity: 0; }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .rise1, .rise2, .rise3, .sweep, .scan, .blink { animation: none; }
      .rise1, .rise2, .rise3 { opacity: 1; transform: none; }
      .sweep { transform: scaleX(1); }
      .scan { opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140f0c"/>
      <stop offset="55%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#201812"/>
    </linearGradient>
    <linearGradient id="title" x1="92" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="75%" stop-color="#f0e6d8"/>
      <stop offset="100%" stop-color="#b89a7a"/>
    </linearGradient>
    <linearGradient id="scan_g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8a87c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f0c49a" stop-opacity="1"/>
      <stop offset="1" stop-color="#e8a87c" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rc"><rect x="40" y="138" width="748" height="4"/></clipPath>
  </defs>

  <rect width="828" height="180" rx="10" fill="url(#bg)"/>
  <rect x="12" y="12" width="804" height="156" rx="8" fill="none" stroke="#3a2e24" stroke-width="1.25"/>

  <rect x="28" y="6" width="136" height="14" fill="#140f0c"/>
  <text class="mono" x="34" y="17" fill="#8a735c" font-size="11" letter-spacing="0.08em">OPENCODE V1 · V2</text>

  <g transform="translate(40, 44)">
    <rect width="36" height="36" rx="8" fill="#241c16" stroke="#4a3a2c" stroke-width="1"/>
    <circle cx="18" cy="18" r="9" fill="none" stroke="#e8a87c" stroke-width="2.25"/>
    <path d="M18 10.5 V18 L23.5 23.5" stroke="#e8a87c" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle class="pulse" cx="27" cy="11" r="2" fill="#e8a87c"/>
  </g>

  <text class="sans rise1" x="92" y="68" fill="url(#title)" font-size="34" font-weight="700" letter-spacing="-0.03em">opencode-claude</text>
  <text class="mono rise2" x="92" y="98" fill="#c4aa8e" font-size="15">Claude Code in OpenCode — local CLI auth, Agent SDK</text>
  <text class="mono rise3" x="92" y="122" fill="#8a735c" font-size="12">effort variants  ·  tools / MCP  ·  images &amp; compact</text>

  <g transform="translate(690, 40)" aria-hidden="true">
    <text class="mono" x="0" y="0" fill="#8a735c" font-size="10">effort</text>
    <rect x="0" y="48" width="10" height="16" rx="2" fill="#3a2e24"/>
    <rect x="16" y="36" width="10" height="28" rx="2" fill="#3a2e24"/>
    <rect x="32" y="22" width="10" height="42" rx="2" fill="#e8a87c" opacity="0.85"/>
    <rect x="48" y="28" width="10" height="36" rx="2" fill="#3a2e24"/>
    <rect x="64" y="14" width="10" height="50" rx="2" fill="#f0c49a"/>
    <text class="mono blink" x="78" y="64" fill="#e8a87c" font-size="12">_</text>
  </g>

  <rect class="sweep" x="40" y="138" width="748" height="4" rx="2" fill="#3a2e24"/>
  <g clip-path="url(#rc)">
    <rect class="scan" x="40" y="138" width="64" height="4" fill="url(#scan_g)"/>
  </g>
</svg>
